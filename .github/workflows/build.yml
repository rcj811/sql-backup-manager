name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build (.NET Framework 4.8)
        run: dotnet build SqlBackupManager.csproj -c Release -o out

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out\SqlBackupManager.exe, out\SqlBackupManager.exe.config, README.md dist\
          Compress-Archive -Path dist\* -DestinationPath SqlBackupManager.zip -Force

      - uses: actions/upload-artifact@v5
        with:
          name: SqlBackupManager
          path: dist/

      - name: Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SqlBackupManager.zip
